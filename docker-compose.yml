services:
  postgres:
    image: postgres:16
    container_name: myapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: BooksDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Umutoninice&23
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BooksDB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: